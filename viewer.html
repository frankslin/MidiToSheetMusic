<!DOCTYPE html>
<!--
  Sheet viewer: shows the PNG pages produced by `sheet input.mid prefix`
  next to a player for the MIDI file they were rendered from.

  Open it with the two file names in the query string, both relative to this
  page (or absolute):

      viewer.html?midi=songs/sample.mid&prefix=sample

  `prefix` defaults to the MIDI file's base name, so the common case is just
  ?midi=songs/sample.mid when the pages were written as sample_1.png, ... in
  this directory. Pages are discovered by loading prefix_1.png, prefix_2.png
  and so on until one is missing.

  `back` adds a link out to an index page, which is how the generated site
  (see tools/build-site.sh) links back from a piece to the list.

  Playback needs html-midi-player, which is loaded from a CDN; without network
  access the pages still render and the player area explains what is missing.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheet viewer</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/combine/npm/tone@14.7.58,npm/@magenta/music@1.23.1/es6/core.js,npm/focus-visible@5,npm/html-midi-player@1.5.0"></script>
<style>
:root {
  --surface:            #ffffff;
  --surface-page:       #f9fafb;
  --surface-container:  #f3f4fb;
  --text-primary:       #111827;
  --text-secondary:     #6b7280;
  --text-muted:         #9ca3af;
  --border-subtle:      #f3f4f6;
  --accent:             #2563eb;
  --accent-subtle:      #eff6ff;
  --elevation-1: 0 1px 2px 0 rgb(0 0 0 / 0.08), 0 1px 3px 1px rgb(0 0 0 / 0.06);
  --elevation-2: 0 1px 2px 0 rgb(0 0 0 / 0.08), 0 2px 6px 2px rgb(0 0 0 / 0.08);
  --ease: cubic-bezier(0.2, 0, 0, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  color: var(--text-primary);
  background: var(--surface-page);
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
button { cursor: pointer; font-family: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- header: title, player, page chips ---------- */

header {
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--surface);
  box-shadow: var(--elevation-1);
}

.bar {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 24px;
}

.title-row {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 12px;
  padding: 20px 0 4px;
}

h1 {
  font-size: 30px;
  font-weight: 500;
  line-height: 1.25;
}

.count {
  font-size: 12px;
  font-weight: 500;
  padding: 3px 12px;
  border-radius: 9999px;
  background: var(--surface-container);
  color: #374151;
}

.source {
  padding-bottom: 16px;
  font-size: 14px;
  color: var(--text-secondary);
}

.source code {
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: 13px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--surface-container);
  color: #374151;
}

/* Shown only when the page was opened with &back=…, i.e. from an index. */
.back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 16px;
  font-size: 14px;
}

.back::before { content: '\2190'; }

midi-player {
  display: block;
  width: 100%;
  padding-bottom: 16px;
}

midi-player::part(control-panel) {
  background: var(--surface-container);
  border: none;
  border-radius: 9999px;
  padding: 6px 16px 6px 6px;
}

midi-player::part(play-button) {
  background: var(--accent);
  color: #fff;
  border-radius: 9999px;
  transition: background 200ms var(--ease);
}

midi-player::part(play-button):hover { background: #1d4ed8; }

midi-player::part(time) {
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: 13px;
  color: var(--text-secondary);
}

/* Page chips. They scroll horizontally on their own so the page body never does. */
nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 0 0 12px;
  scrollbar-width: thin;
}

nav button {
  flex: none;
  min-width: 40px;
  height: 32px;
  padding: 0 12px;
  border: none;
  border-radius: 9999px;
  background: var(--surface-container);
  color: #374151;
  font-size: 13px;
  font-weight: 500;
  transition: background 150ms var(--ease), color 150ms var(--ease);
}

nav button:hover { background: #e6e8f6; }

nav button[aria-current='true'] {
  background: var(--accent-subtle);
  color: var(--accent);
}

/* ---------- pages ---------- */

main {
  max-width: 960px;
  margin: 0 auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.page {
  background: var(--surface);
  border-radius: 16px;
  box-shadow: var(--elevation-1);
  overflow: hidden;
  scroll-margin-top: 200px;
  transition: box-shadow 200ms var(--ease);
}

.page:hover { box-shadow: var(--elevation-2); }

.page img {
  display: block;
  width: 100%;
  height: auto;
}

.page figcaption {
  padding: 12px 20px;
  border-top: 1px solid var(--border-subtle);
  font-size: 14px;
  color: var(--text-secondary);
}

/* ---------- notices ---------- */

.notice {
  max-width: 960px;
  margin: 24px auto;
  padding: 20px 24px;
  border-radius: 16px;
  background: var(--surface);
  box-shadow: var(--elevation-1);
  font-size: 15px;
  color: var(--text-secondary);
}

.notice p + p { margin-top: 8px; }

.notice strong { font-weight: 500; color: var(--text-primary); }

.notice code {
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: 13px;
  padding: 2px 8px;
  border-radius: 4px;
  background: var(--surface-container);
  color: #374151;
}

.hint {
  max-width: 960px;
  margin: 0 auto;
  padding: 0 24px 32px;
  font-size: 14px;
  color: var(--text-muted);
}

[hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="title-row">
      <h1 id="title">Sheet viewer</h1>
      <span class="count" id="count" hidden></span>
    </div>
    <p class="source" id="source"></p>
    <a class="back" id="back" hidden>All pieces</a>
    <midi-player id="player" sound-font hidden></midi-player>
    <div class="notice" id="player-notice" style="margin:0 0 16px;padding:12px 16px;" hidden></div>
    <nav id="nav" aria-label="Pages" hidden></nav>
  </div>
</header>

<main id="pages"></main>
<div class="notice" id="notice" hidden></div>
<p class="hint" id="hint" hidden>Use the left and right arrow keys to move between pages.</p>

<script>
(function () {
  'use strict';

  var MAX_PAGES = 200;

  var params = new URLSearchParams(location.search);
  var midi = params.get('midi') || '';
  var prefix = params.get('prefix') || basename(midi).replace(/\.midi?$/i, '');

  var els = {
    title: document.getElementById('title'),
    count: document.getElementById('count'),
    source: document.getElementById('source'),
    back: document.getElementById('back'),
    player: document.getElementById('player'),
    playerNotice: document.getElementById('player-notice'),
    nav: document.getElementById('nav'),
    pages: document.getElementById('pages'),
    notice: document.getElementById('notice'),
    hint: document.getElementById('hint')
  };

  function basename(path) {
    return path.split(/[\\/]/).pop();
  }

  // "Bach__Minuet_in_G_major" -> "Bach — Minuet in G major", which is how the
  // files in songs/ are named. Anything else just loses its underscores.
  function prettify(name) {
    return name.split('__').map(function (part) {
      return part.replace(/_/g, ' ').trim();
    }).filter(Boolean).join(' — ');
  }

  function notice(el, html) {
    el.innerHTML = html;
    el.hidden = false;
  }

  if (!midi && !prefix) {
    notice(els.notice,
      '<p><strong>Nothing to show yet.</strong> Name the MIDI file in the query string:</p>' +
      '<p><code>viewer.html?midi=songs/sample.mid</code></p>' +
      '<p>The PNG pages are looked up next to this page as ' +
      '<code>sample_1.png</code>, <code>sample_2.png</code>, … ' +
      'Pass <code>&amp;prefix=…</code> if they were written somewhere else.</p>');
    return;
  }

  var name = prettify(basename(prefix) || basename(midi));
  document.title = name + ' · Sheet viewer';
  els.title.textContent = name;
  els.source.innerHTML = midi
    ? 'Rendered from <code>' + escapeHtml(midi) + '</code>'
    : 'Pages <code>' + escapeHtml(prefix) + '_*.png</code>';

  function escapeHtml(s) {
    return s.replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  var back = params.get('back');
  if (back) {
    els.back.href = back;
    els.back.hidden = false;
  }

  /* ---- player ---- */

  if (midi) {
    els.player.src = midi;
    els.player.hidden = false;
    // The CDN bundle defines the element; without it the tag stays an inert
    // <midi-player> and playback silently does nothing, so say so instead.
    window.addEventListener('load', function () {
      if (window.customElements && customElements.get('midi-player')) return;
      els.player.hidden = true;
      notice(els.playerNotice,
        '<p><strong>Playback is unavailable.</strong> The player is loaded from a CDN and ' +
        'this page could not reach it. The sheet pages below are unaffected.</p>' +
        '<p><a href="' + escapeHtml(midi) + '" download>Download the MIDI file</a> to play it locally.</p>');
    });
  }

  /* ---- pages ---- */

  var pages = [];

  function load(n) {
    return new Promise(function (resolve) {
      var img = new Image();
      img.onload = function () { resolve(img); };
      img.onerror = function () { resolve(null); };
      img.src = prefix + '_' + n + '.png';
    });
  }

  (function next(n) {
    if (n > MAX_PAGES) return done();
    load(n).then(function (img) {
      if (!img) return done();
      pages.push(addPage(n, img.src));
      next(n + 1);
    });
  })(1);

  function addPage(n, src) {
    var figure = document.createElement('figure');
    figure.className = 'page';
    figure.id = 'page-' + n;

    var img = document.createElement('img');
    img.src = src;
    img.alt = 'Page ' + n;
    img.loading = n > 2 ? 'lazy' : 'eager';

    var caption = document.createElement('figcaption');
    caption.textContent = 'Page ' + n;

    figure.appendChild(img);
    figure.appendChild(caption);
    els.pages.appendChild(figure);

    var chip = document.createElement('button');
    chip.type = 'button';
    chip.textContent = n;
    chip.setAttribute('aria-label', 'Go to page ' + n);
    chip.addEventListener('click', function () { go(n - 1); });
    els.nav.appendChild(chip);

    return { figure: figure, chip: chip };
  }

  function done() {
    if (!pages.length) {
      notice(els.notice,
        '<p><strong>No pages found for <code>' + escapeHtml(prefix) + '</code>.</strong> ' +
        'This page looked for <code>' + escapeHtml(prefix) + '_1.png</code> next to itself.</p>' +
        '<p>Generate the pages first, then reload:</p>' +
        '<p><code>dotnet bin/sheet.dll ' + escapeHtml(midi || 'input.mid') + ' ' +
        escapeHtml(prefix) + '</code></p>');
      return;
    }

    els.count.textContent = pages.length + (pages.length === 1 ? ' page' : ' pages');
    els.count.hidden = false;
    els.nav.hidden = pages.length < 2;
    els.hint.hidden = pages.length < 2;
    track();
  }

  var current = 0;

  function mark(i) {
    if (i === current) return;
    if (pages[current]) pages[current].chip.removeAttribute('aria-current');
    current = i;
    pages[current].chip.setAttribute('aria-current', 'true');
    pages[current].chip.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }

  function go(i) {
    if (i < 0 || i >= pages.length) return;
    pages[i].figure.scrollIntoView({ behavior: 'smooth', block: 'start' });
    mark(i);
  }

  // Highlight whichever page occupies the middle of the viewport, so the chip
  // row follows an ordinary scroll as well as an explicit jump.
  function track() {
    pages[0].chip.setAttribute('aria-current', 'true');

    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        if (!entry.isIntersecting) return;
        var i = pages.findIndex(function (p) { return p.figure === entry.target; });
        if (i >= 0) mark(i);
      });
    }, { rootMargin: '-45% 0px -45% 0px' });

    pages.forEach(function (p) { observer.observe(p.figure); });

    document.addEventListener('keydown', function (e) {
      if (e.metaKey || e.ctrlKey || e.altKey) return;
      if (e.key === 'ArrowRight') { go(current + 1); e.preventDefault(); }
      if (e.key === 'ArrowLeft') { go(current - 1); e.preventDefault(); }
    });
  }
})();
</script>

</body>
</html>
